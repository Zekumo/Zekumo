<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zekumo 通行证</title>
<style>
  :root { --bg:#0f1420; --panel:#1a2233; --line:#2a3550; --text:#e6ebf5; --dim:#8b96ad; --accent:#4f8cff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; width:100%; max-width:360px; }
  h1 { font-size:17px; margin-bottom:4px; }
  h1 span { color:var(--accent); }
  p.sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  input { background:#0d1220; border:1px solid var(--line); border-radius:6px; color:var(--text);
          padding:10px 12px; font:inherit; width:100%; margin-bottom:10px; }
  button { background:var(--accent); border:0; border-radius:6px; color:#fff; padding:10px; font:inherit;
           cursor:pointer; width:100%; }
  button:hover { filter:brightness(1.1); }
  .toggle { text-align:center; margin-top:12px; font-size:13px; color:var(--dim); }
  .toggle a { color:var(--accent); cursor:pointer; }
  #error { color:#e05b5b; font-size:13px; margin-bottom:10px; min-height:18px; }
  #blocked { color:#e05b5b; }
</style>
</head>
<body>
<div class="card">
  <h1><span>Zekumo</span> 通行证</h1>
  <p class="sub" id="gameName">正在加载…</p>
  <div id="form" style="display:none">
    <div id="error"></div>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <input id="nickname" placeholder="昵称(可选)" style="display:none">
    <button id="submitBtn" onclick="submit()">登录并进入游戏</button>
    <div class="toggle" id="toggleLine">没有账号?<a onclick="setMode('register')">注册一个</a></div>
  </div>
  <p id="blocked" style="display:none"></p>
</div>

<script>
const params = new URLSearchParams(location.search);
const appId = params.get('app_id') || '';
const redirectUri = params.get('redirect_uri') || '';
const state = params.get('state') || '';
let mode = 'login';

function setMode(m) {
  mode = m;
  document.getElementById('nickname').style.display = m === 'register' ? '' : 'none';
  document.getElementById('submitBtn').textContent = m === 'register' ? '注册并进入游戏' : '登录并进入游戏';
  document.getElementById('toggleLine').innerHTML = m === 'register'
    ? '已有账号?<a onclick="setMode(\'login\')">直接登录</a>'
    : '没有账号?<a onclick="setMode(\'register\')">注册一个</a>';
}

function block(text) {
  document.getElementById('gameName').textContent = '';
  document.getElementById('form').style.display = 'none';
  const el = document.getElementById('blocked');
  el.style.display = ''; el.textContent = text;
}

async function init() {
  if (!appId || !redirectUri) return block('链接不完整:缺少 app_id 或 redirect_uri 参数。');
  try {
    const res = await fetch(`/sso/api/authorize/info?app_id=${encodeURIComponent(appId)}&redirect_uri=${encodeURIComponent(redirectUri)}`);
    const info = await res.json();
    if (!res.ok) return block(info.error ? info.error.message : '加载失败');
    if (!info.redirect_valid) return block('回跳地址未在该游戏的白名单中,已阻止登录。请联系游戏开发者。');
    document.getElementById('gameName').textContent = `登录后将进入:${info.game_name}`;
    document.getElementById('form').style.display = '';
  } catch { block('无法连接服务器'); }
}

async function submit() {
  const err = document.getElementById('error');
  err.textContent = '';
  try {
    const body = {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    };
    if (mode === 'register') body.nickname = document.getElementById('nickname').value.trim();
    let res = await fetch(mode === 'register' ? '/sso/api/register' : '/sso/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    let data = await res.json();
    if (!res.ok) { err.textContent = data.error ? data.error.message : '失败'; return; }

    res = await fetch('/sso/api/tickets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + data.token },
      body: JSON.stringify({ app_id: appId }),
    });
    const t = await res.json();
    if (!res.ok) { err.textContent = t.error ? t.error.message : '获取票据失败'; return; }

    const sep = redirectUri.includes('?') ? '&' : '?';
    location.href = `${redirectUri}${sep}ticket=${encodeURIComponent(t.ticket)}` +
      (state ? `&state=${encodeURIComponent(state)}` : '');
  } catch { err.textContent = '网络错误,请重试'; }
}

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
init();
</script>
</body>
</html>
