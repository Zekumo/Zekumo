# Zekumo 反向代理配置(面板「网站 / 反向代理」里粘贴,或直接放进 Nginx 站点)
#
# 前置链路:浏览器/客户端 → Cloudflare → 面板 Nginx(本文件)→ 127.0.0.1:8080
#
# 这里有四处不能省,漏了会出实际故障:
#   1. WebSocket 升级 —— 少了 /v1/ws 直接连不上,实时房间和聊天全废
#   2. client_max_body_size —— 默认 1MB,2GB 的游戏产物一上传就 413
#   3. 上传/下载的超时 —— 默认 60s,大文件传一半被掐断
#   4. 真实客户端 IP —— 拿不到就所有请求都算同一个来源,限流形同虚设
#
# 如果面板的反代表单只让填「目标地址」,先按表单填 http://127.0.0.1:8080,
# 再找「自定义配置 / 高级」把下面的 location 段和 client_max_body_size 补进去。

server {
    listen 80;
    server_name panel.mn1.top;

    # 产物上传走的是 PUT /storage/put,单个包可能到 2GB。
    # 必须 ≥ .env 里的 MAX_ARTIFACT_SIZE,否则 Nginx 先于应用返回 413。
    client_max_body_size 2048m;
    # 大包直接透传给后端,不要落 Nginx 临时盘再转发。
    proxy_request_buffering off;

    # ---- 真实客户端 IP ----------------------------------------------------
    # Cloudflare 把访客 IP 放在 CF-Connecting-IP,并追加到 X-Forwarded-For。
    # 应用读 X-Forwarded-For 的最左值,所以这里要把 CF 的值原样传下去,
    # 不要用 $remote_addr 覆盖(那样只会得到 Cloudflare 的出口 IP)。
    #
    # 前提是源站已锁定为仅 Cloudflare 可达。没锁的话任何人都能伪造这个头,
    # 把按 IP 限流整个绕过去 —— 见 README 的「锁定源站」。
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Real-IP       $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host            $host;

    # ---- WebSocket:实时房间与聊天 ---------------------------------------
    location /v1/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;

        # 长连接不能被超时掐断。服务端每 30 秒发一次 ping,
        # 这里留足余量;Cloudflare 侧默认 100 秒空闲超时,ping 足以维持。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ---- 产物上传下载:大文件,需要更长超时 -------------------------------
    location /storage/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout  1800s;
        proxy_send_timeout  1800s;
        proxy_buffering     off;
    }

    # ---- 其余全部 --------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # 面板自己的健康检查可以打这里,不必经过 Cloudflare。
    location = /readyz {
        proxy_pass http://127.0.0.1:8080/readyz;
        access_log off;
    }
}
