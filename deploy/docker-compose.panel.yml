# 面板部署用的编排文件(1Panel / 宝塔 / Portainer 的「容器编排」都能直接贴)。
#
# 与 docker-compose.prod.yml 的区别:
#   - 应用只绑 127.0.0.1:8080,由面板自带的 Nginx 反代到域名,不自己抢 80/443
#   - 镜像在服务器上从源码构建(面板环境一般没有私有镜像仓库)
#   - 数据用具名卷,面板的「容器 → 卷」里能看到、能备份
#
# 用法见同目录 README.md。环境变量从 .env 读取,和本文件放同一目录。

name: zekumo

services:
  postgres:
    image: postgres:16-alpine
    container_name: zekumo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zekumo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      POSTGRES_DB: zekumo
      # 中文数据的排序与比较规则
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不映射端口:只有本编排内的服务能连,外网和其他容器都碰不到
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zekumo"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:7-alpine
    container_name: zekumo-redis
    restart: unless-stopped
    # noeviction:排行榜和限流计数不能被当缓存淘汰掉。
    # appendonly:重启后不必从 Postgres 全量重建排行榜。
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512m }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  server:
    build:
      context: ./src
      args:
        VERSION: ${VERSION:-1.0.0}
    image: zekumo:${VERSION:-1.0.0}
    container_name: zekumo-server
    restart: unless-stopped
    # 只绑回环:公网流量必须经过面板的 Nginx,不能直连应用端口。
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ZEKUMO_ENV: production
      DATABASE_URL: postgres://zekumo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}@postgres:5432/zekumo
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必填}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD 必填}
      BASE_URL: ${BASE_URL:?BASE_URL 必填,例如 https://panel.mn1.top}
      # 只有在源站被锁定成「仅 Cloudflare 可达」之后开启才安全,
      # 否则任何人都能伪造 X-Forwarded-For 绕过按 IP 限流。
      TRUST_PROXY: ${TRUST_PROXY:-true}
      STORAGE_DRIVER: local
      LOCAL_DATA_DIR: /data
      MAX_ARTIFACT_SIZE: ${MAX_ARTIFACT_SIZE:-2147483648}
      STATS_TZ: ${STATS_TZ:-Asia/Shanghai}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      LOG_HTTP_ALL: ${LOG_HTTP_ALL:-false}
      TOKEN_TTL: ${TOKEN_TTL:-168h}
    volumes:
      - artifactdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 1g }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

volumes:
  pgdata:
  redisdata:
  artifactdata:
