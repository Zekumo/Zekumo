services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zekumo
      POSTGRES_PASSWORD: zekumo
      POSTGRES_DB: zekumo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zekumo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://zekumo:zekumo@postgres:5432/zekumo
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      STORAGE_DRIVER: local
      LOCAL_DATA_DIR: /data
    volumes:
      - artifactdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  artifactdata:
